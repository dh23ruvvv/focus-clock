<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="Minimal focus clock - stay off your phone and study">
  <title>Focus Clock</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: 'Inter', 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    }

    /* ══════════════════════════════════════════════════
       START SCREEN
       ══════════════════════════════════════════════════ */
    #start-screen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: none;
    }

    #start-screen.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    /* New Start Screen Stats */
    .start-stats-top {
      text-align: center;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .start-streak {
      color: rgba(255, 100, 50, 0.8);
      font-size: clamp(0.8rem, 2.5vw, 1.1rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .start-weekly {
      color: rgba(255, 255, 255, 0.25);
      font-size: clamp(0.65rem, 2vw, 0.85rem);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .start-daily-label {
      color: rgba(255, 255, 255, 0.35);
      font-size: clamp(0.65rem, 2vw, 0.85rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .start-daily-time {
      color: rgba(255, 255, 255, 0.55);
      font-size: clamp(1.8rem, 8vw, 3.5rem);
      font-weight: 200;
      letter-spacing: 0.02em;
      margin-bottom: 1.2rem;
    }

    /* Target progress bar */
    .target-bar-container {
      width: min(80%, 320px);
      margin-bottom: 2rem;
    }

    .target-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .target-bar-fill {
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      transition: width 0.8s ease;
      width: 0%;
    }

    .target-bar-fill.complete {
      background: rgba(120, 200, 120, 0.5);
    }

    .target-bar-label {
      display: flex;
      justify-content: space-between;
      margin-top: 0.4rem;
      color: rgba(255, 255, 255, 0.2);
      font-size: clamp(0.55rem, 1.6vw, 0.7rem);
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    /* New Start Screen Bottom Stats */
    .start-stats-bottom {
      text-align: center;
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .time-left {
      color: rgba(255, 255, 255, 0.25);
      font-size: clamp(0.6rem, 1.8vw, 0.75rem);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .personal-best {
      color: rgba(255, 215, 0, 0.4);
      font-size: clamp(0.6rem, 1.8vw, 0.75rem);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    /* Slide up hint */
    .slide-hint {
      color: rgba(255, 255, 255, 0.2);
      font-size: clamp(0.6rem, 1.8vw, 0.75rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      margin-top: 1rem;
      animation: slideHintPulse 2.5s ease-in-out infinite;
    }

    .slide-arrow {
      display: block;
      text-align: center;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.15);
      font-size: 1.2rem;
      animation: slideHintPulse 2.5s ease-in-out infinite;
    }

    @keyframes slideHintPulse {
      0%, 100% { opacity: 1; transform: translateY(0); }
      50% { opacity: 0.4; transform: translateY(-4px); }
    }

    /* ══════════════════════════════════════════════════
       CLOCK SCREEN
       ══════════════════════════════════════════════════ */
    #clock-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s, box-shadow 2s ease;
    }

    #clock-screen.visible {
      opacity: 1;
    }

    /* Intensity Glows */
    #clock-screen.glow-2h { box-shadow: inset 0 0 50px rgba(255, 255, 255, 0.02); }
    #clock-screen.glow-4h { box-shadow: inset 0 0 100px rgba(255, 200, 150, 0.04); }
    #clock-screen.glow-6h { box-shadow: inset 0 0 150px rgba(255, 100, 50, 0.08); }

    /* ── Motivational quote ── */
    #quote {
      color: rgba(255, 255, 255, 0.32);
      font-size: clamp(0.65rem, 1.8vw, 0.85rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 0 1rem;
      transition: opacity 1s ease-in-out;
      min-height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #quote.fade-out {
      opacity: 0;
    }

    /* ── Clock ── */
    #clock-container {
      position: relative;
    }

    #clock {
      color: #ffffff;
      font-size: clamp(6rem, 36vw, 22rem);
      font-weight: 200;
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1;
      position: relative;
      z-index: 2;
    }

    /* Hourly Pulse Animation */
    .pulse-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    .pulse-anim {
      animation: hourlyPulse 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes hourlyPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); opacity: 1; }
      100% { box-shadow: 0 0 0 100px rgba(255, 255, 255, 0); opacity: 0; }
    }

    .colon {
      display: inline-block;
      opacity: 0.6;
    }

    /* ── Info row ── */
    .info-row {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-top: 1.2rem;
    }

    .info-item {
      color: rgba(255, 255, 255, 0.25);
      font-size: clamp(0.75rem, 2.8vw, 1.1rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }

    .info-value {
      color: rgba(255, 255, 255, 0.45);
      font-size: clamp(0.95rem, 3.5vw, 1.4rem);
      font-weight: 200;
      letter-spacing: 0.04em;
      margin-top: 0.2rem;
    }

    .dot-separator {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
    }

    .countdown-number {
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
    }

    /* ── Progress bar ── */
    #progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.12);
      transition: width 1s linear;
    }

    /* ── Wake lock indicator ── */
    #wake-indicator {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #1a1a1a;
      transition: background 0.3s ease;
    }

    #wake-indicator.active {
      background: #1a3a1a;
    }

    /* ── Dim mode ── */
    body.dimmed #clock-screen {
      opacity: 0.15 !important;
    }

    /* ══════════════════════════════════════════════════
       CONFETTI
       ══════════════════════════════════════════════════ */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════
       LANDSCAPE
       ══════════════════════════════════════════════════ */
    @media (orientation: landscape) {
      #quote {
        margin-bottom: 0.8rem;
        font-size: clamp(0.6rem, 1.6vh, 0.8rem);
      }

      #clock {
        font-size: clamp(8rem, 42vh, 28rem);
      }

      .info-row {
        margin-top: 0.8rem;
      }

      .info-item {
        font-size: clamp(0.7rem, 2.2vh, 1rem);
      }

      .info-value {
        font-size: clamp(0.85rem, 2.8vh, 1.2rem);
      }

      .start-daily-time {
        font-size: clamp(1.5rem, 8vh, 3rem);
      }

      .target-bar-container {
        width: min(50%, 300px);
      }
    }

    /* ── Small portrait screens ── */
    @media (max-height: 500px) and (orientation: portrait) {
      .info-row {
        margin-top: 0.6rem;
        gap: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- ═══ START SCREEN ═══ -->
  <div id="start-screen">
    <div class="start-stats-top">
      <div class="start-streak" id="streak-display"></div>
      <div class="start-weekly" id="weekly-display"></div>
    </div>

    <div class="start-daily-label">today's study time</div>
    <div class="start-daily-time" id="daily-total">0h 0m</div>

    <div class="target-bar-container">
      <div class="target-bar-track">
        <div class="target-bar-fill" id="target-fill"></div>
      </div>
      <div class="target-bar-label">
        <span id="target-current">0h 0m</span>
        <span>10h target</span>
      </div>
    </div>

    <div class="start-stats-bottom">
      <div class="time-left" id="time-left-display"></div>
      <div class="personal-best" id="personal-best-display"></div>
    </div>

    <span class="slide-arrow">▲</span>
    <div class="slide-hint">slide up to start study session</div>
  </div>

  <!-- ═══ CLOCK SCREEN ═══ -->
  <div id="clock-screen">
    <div id="quote"></div>
    <div id="clock-container">
      <div id="clock"></div>
      <div id="pulse-ring" class="pulse-ring"></div>
    </div>

    <div class="info-row">
      <div class="info-item">
        <div>studied</div>
        <div class="info-value" id="study-timer">0m</div>
      </div>
      <div class="dot-separator"></div>
      <div class="info-item">
        <div>remaining</div>
        <div class="info-value" id="countdown"><span class="countdown-number">--</span> days</div>
      </div>
    </div>
  </div>

  <div id="progress-bar"></div>
  <div id="wake-indicator"></div>
  <canvas id="confetti-canvas"></canvas>

  <script>
    // ══════════════════════════════════════════════════
    // CONFIG & QUOTES
    // ══════════════════════════════════════════════════
    const GOAL_DATE = new Date('2026-07-10T00:00:00');
    const START_DATE = new Date('2026-06-11T00:00:00');
    const TARGET_HOURS = 10;
    const TARGET_MS = TARGET_HOURS * 60 * 60 * 1000;
    const AUTOSAVE_INTERVAL = 5000; // Save every 5 seconds
    const STORAGE_KEY = 'focusClock';
    const MIN_STREAK_MS = 7 * 60 * 60 * 1000; // 7 hours minimum for streak

    const QUOTES = [
      "the people who are crazy enough to think they can change the world are the ones who do.",
      "you are not tired, you are uninspired.",
      "while you sleep, someone else is getting better.",
      "pain is temporary. the day you quit lasts forever.",
      "don't let five minutes of weakness erase five months of work.",
      "obsession is a word the lazy use to describe the dedicated.",
      "if it was easy, everyone would do it.",
      "you didn't come this far to only come this far.",
      "be so good they can't ignore you.",
      "suffer the pain of discipline or suffer the pain of regret.",
      "do what you have to do until you can do what you want to do.",
      "prove them wrong.",
      "your future needs you. your past doesn't.",
      "the only bad workout is the one that didn't happen.",
      "make yourself proud.",
      "no excuses. play like a champion.",
      "hard work beats talent when talent doesn't work hard.",
      "success is the sum of small efforts, repeated day in and day out.",
      "don't stop when you're tired. stop when you're done.",
      "the secret of getting ahead is getting started.",
      "it's not about perfect. it's about effort.",
      "focus on your goal. don't look in any direction but ahead.",
      "dream big. work hard. stay focused.",
      "you are your only limit.",
      "push yourself, because no one else is going to do it for you.",
      "great things never come from comfort zones.",
      "wake up with determination. go to bed with satisfaction.",
      "do something today that your future self will thank you for.",
      "little things make big days.",
      "it's going to be hard, but hard does not mean impossible.",
      "don't wait for opportunity. create it.",
      "sometimes later becomes never. do it now.",
      "discipline is choosing between what you want now and what you want most.",
      "the harder you work for something, the greater you'll feel when you achieve it.",
      "work until your idols become your rivals.",
      "starve your distractions, feed your focus.",
      "a goal without a plan is just a wish.",
      "the best way to predict the future is to create it.",
      "stay positive, work hard, make it happen.",
      "believe you can and you're halfway there."
    ];

    // ══════════════════════════════════════════════════
    // ELEMENTS
    // ══════════════════════════════════════════════════
    const startScreen = document.getElementById('start-screen');
    const clockScreen = document.getElementById('clock-screen');
    const clockEl = document.getElementById('clock');
    const studyTimerEl = document.getElementById('study-timer');
    const countdownEl = document.getElementById('countdown');
    const progressBar = document.getElementById('progress-bar');
    const wakeIndicator = document.getElementById('wake-indicator');
    const dailyTotalEl = document.getElementById('daily-total');
    const targetFill = document.getElementById('target-fill');
    const targetCurrentEl = document.getElementById('target-current');
    const confettiCanvas = document.getElementById('confetti-canvas');
    const quoteEl = document.getElementById('quote');
    const streakDisplay = document.getElementById('streak-display');
    const weeklyDisplay = document.getElementById('weekly-display');
    const timeLeftDisplay = document.getElementById('time-left-display');
    const personalBestDisplay = document.getElementById('personal-best-display');
    const pulseRing = document.getElementById('pulse-ring');

    // ══════════════════════════════════════════════════
    // STATE
    // ══════════════════════════════════════════════════
    let wakeLock = null;
    let sessionActive = false;       // Is user on clock screen?
    let timerRunning = false;        // Is timer actively counting?
    let sessionActiveMs = 0;         // Active ms in current session
    let lastTickTime = null;         // Last time we recorded a tick
    let autosaveTimer = null;
    let clockInterval = null;
    let quoteInterval = null;
    let isDimmed = false;
    let confettiShown = false;
    let currentDayKey = getTodayKey();
    let currentQuoteIndex = 0;
    let lastHourlyMilestone = 0;

    // ══════════════════════════════════════════════════
    // LOCAL STORAGE — SESSION PERSISTENCE & STATS
    // ══════════════════════════════════════════════════
    function getTodayKey() {
      const now = new Date();
      const adjusted = new Date(now.getTime() - 6 * 60 * 60 * 1000); // Shift day boundary to 6:00 AM
      return `${adjusted.getFullYear()}-${String(adjusted.getMonth() + 1).padStart(2, '0')}-${String(adjusted.getDate()).padStart(2, '0')}`;
    }

    function checkDayTransition() {
      const todayKey = getTodayKey();
      if (todayKey !== currentDayKey) {
        if (sessionActive) {
          saveCurrentSession(currentDayKey);
          window._sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          sessionActiveMs = 0;
          lastHourlyMilestone = 0;
          if (timerRunning) {
            lastTickTime = Date.now();
          }
        }
        currentDayKey = todayKey;
        updateStartScreen();
      }
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { sessions: {}, confettiShownDate: '', streak: 0, lastStreakDate: '', bestSessionMs: 0, bestDayMs: 0 };
        const data = JSON.parse(raw);
        // Ensure new fields exist
        if (data.streak === undefined) data.streak = 0;
        if (data.lastStreakDate === undefined) data.lastStreakDate = '';
        if (data.bestSessionMs === undefined) data.bestSessionMs = 0;
        if (data.bestDayMs === undefined) data.bestDayMs = 0;
        return data;
      } catch {
        return { sessions: {}, confettiShownDate: '', streak: 0, lastStreakDate: '', bestSessionMs: 0, bestDayMs: 0 };
      }
    }

    function saveData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch { /* storage full — unlikely for this tiny data */ }
    }

    function getTodaySessions() {
      const data = loadData();
      const key = getTodayKey();
      return data.sessions[key] || [];
    }

    function getTodayTotalMs() {
      const sessions = getTodaySessions();
      return sessions.reduce((sum, s) => sum + (s.duration || 0), 0);
    }

    function getWeekTotalMs() {
      const data = loadData();
      const now = new Date();
      let total = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(now.getTime() - i * 24 * 60 * 60 * 1000 - 6 * 60 * 60 * 1000);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const sessions = data.sessions[key] || [];
        total += sessions.reduce((sum, s) => sum + (s.duration || 0), 0);
      }
      return total;
    }

    function getTimeLeftTodayMs() {
      const now = new Date();
      const currentHour = now.getHours();
      const target = new Date(now);
      if (currentHour < 6) {
        target.setHours(6, 0, 0, 0);
      } else {
        target.setDate(target.getDate() + 1);
        target.setHours(6, 0, 0, 0);
      }
      return target.getTime() - now.getTime();
    }

    function checkStreakAndBests() {
      const data = loadData();
      const todayKey = getTodayKey();
      
      const currentSessionMs = getCurrentSessionMs();
      const todayMs = getTodayTotalMs() + currentSessionMs;
      
      let changed = false;
      if (currentSessionMs > data.bestSessionMs) {
        data.bestSessionMs = currentSessionMs;
        changed = true;
      }
      if (todayMs > data.bestDayMs) {
        data.bestDayMs = todayMs;
        changed = true;
      }
      
      if (todayMs >= MIN_STREAK_MS && data.lastStreakDate !== todayKey) {
        const now = new Date();
        const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000 - 6 * 60 * 60 * 1000);
        const yesterdayKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;
        
        if (data.lastStreakDate === yesterdayKey) {
          data.streak += 1;
        } else if (data.lastStreakDate !== todayKey) {
          data.streak = 1;
        }
        data.lastStreakDate = todayKey;
        changed = true;
      }

      const now = new Date();
      const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000 - 6 * 60 * 60 * 1000);
      const yesterdayKey = `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}`;
      if (data.lastStreakDate !== todayKey && data.lastStreakDate !== yesterdayKey && data.streak > 0) {
        data.streak = 0;
        changed = true;
      }

      if (changed) {
        saveData(data);
      }
    }

    function saveCurrentSession(dayKey) {
      const currentMs = getCurrentSessionMs();
      if (currentMs <= 0) return;

      const data = loadData();
      const key = dayKey || getTodayKey();

      if (!data.sessions[key]) data.sessions[key] = [];

      // Find or create current session entry (last one if it has our sessionId)
      const sid = window._sessionId;
      const existing = data.sessions[key].find(s => s.id === sid);

      if (existing) {
        existing.duration = currentMs;
      } else {
        data.sessions[key].push({
          id: sid,
          startTime: new Date().toISOString(),
          duration: currentMs
        });
      }

      // Clean up old days (keep last 14 days to be safe for weekly view)
      const keys = Object.keys(data.sessions).sort();
      while (keys.length > 14) {
        delete data.sessions[keys.shift()];
      }

      saveData(data);
    }

    // Generate unique session ID
    window._sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // ══════════════════════════════════════════════════
    // STUDY TIMER — PAUSE/RESUME LOGIC
    // ══════════════════════════════════════════════════
    function startTimer() {
      timerRunning = true;
      lastTickTime = Date.now();
    }

    function pauseTimer() {
      if (timerRunning && lastTickTime) {
        // Add elapsed time since last tick
        sessionActiveMs += Date.now() - lastTickTime;
        lastTickTime = null;
      }
      timerRunning = false;
      saveCurrentSession(); // Save immediately on pause
    }

    function getCurrentSessionMs() {
      let total = sessionActiveMs;
      if (timerRunning && lastTickTime) {
        total += Date.now() - lastTickTime;
      }
      return total;
    }

    // ══════════════════════════════════════════════════
    // DISPLAY HELPERS
    // ══════════════════════════════════════════════════
    function formatDuration(ms) {
      const totalMin = Math.floor(ms / 60000);
      const hrs = Math.floor(totalMin / 60);
      const mins = totalMin % 60;
      if (hrs > 0) return `${hrs}h ${mins}m`;
      return `${mins}m`;
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours() % 12;
      if (hours === 0) hours = 12;
      const m = String(now.getMinutes()).padStart(2, '0');
      clockEl.innerHTML = `${hours}<span class="colon">:</span>${m}`;
    }

    function updateStudyTimer() {
      studyTimerEl.textContent = formatDuration(getCurrentSessionMs());
    }

    function updateCountdown() {
      const now = new Date();
      const diff = GOAL_DATE - now;

      if (diff <= 0) {
        countdownEl.innerHTML = `<span class="countdown-number">0</span> days`;
        progressBar.style.width = '100%';
        return;
      }

      const daysLeft = Math.ceil(diff / (1000 * 60 * 60 * 24));

      if (daysLeft <= 3) {
        const totalHours = Math.floor(diff / (1000 * 60 * 60));
        countdownEl.innerHTML = `<span class="countdown-number">${totalHours}</span> hrs`;
      } else {
        countdownEl.innerHTML = `<span class="countdown-number">${daysLeft}</span> days`;
      }

      const totalPrep = GOAL_DATE - START_DATE;
      const elapsed = now - START_DATE;
      const pct = Math.min(100, Math.max(0, (elapsed / totalPrep) * 100));
      progressBar.style.width = `${pct}%`;
    }

    function checkHourlyMilestone() {
      const currentMs = getCurrentSessionMs();
      const currentHours = Math.floor(currentMs / (60 * 60 * 1000));
      
      if (currentHours > 0 && currentHours > lastHourlyMilestone) {
        lastHourlyMilestone = currentHours;
        // Trigger pulse
        pulseRing.classList.remove('pulse-anim');
        void pulseRing.offsetWidth; // trigger reflow
        pulseRing.classList.add('pulse-anim');
      }
    }

    function updateIntensityGlow() {
      const todayMs = getTodayTotalMs() + getCurrentSessionMs();
      const hours = todayMs / (60 * 60 * 1000);
      
      clockScreen.classList.remove('glow-2h', 'glow-4h', 'glow-6h');
      if (hours >= 6) {
        clockScreen.classList.add('glow-6h');
      } else if (hours >= 4) {
        clockScreen.classList.add('glow-4h');
      } else if (hours >= 2) {
        clockScreen.classList.add('glow-2h');
      }
    }

    function updateStartScreen() {
      checkStreakAndBests(); 
      const data = loadData();
      
      const todayMs = getTodayTotalMs() + (sessionActive ? getCurrentSessionMs() : 0);
      const pct = Math.min(100, (todayMs / TARGET_MS) * 100);

      dailyTotalEl.textContent = formatDuration(todayMs);
      targetCurrentEl.textContent = formatDuration(todayMs);
      targetFill.style.width = `${pct}%`;

      if (pct >= 100) {
        targetFill.classList.add('complete');
      } else {
        targetFill.classList.remove('complete');
      }
      
      if (data.streak > 0) {
        streakDisplay.textContent = `🔥 Day ${data.streak} streak`;
      } else {
        streakDisplay.textContent = ``; // Keep empty if no active streak
      }
      
      weeklyDisplay.textContent = `this week: ${formatDuration(getWeekTotalMs() + (sessionActive ? getCurrentSessionMs() : 0))}`;
      
      if (data.bestDayMs > 0 || data.bestSessionMs > 0) {
        personalBestDisplay.innerHTML = `best day: ${formatDuration(data.bestDayMs)} &nbsp;|&nbsp; best session: ${formatDuration(data.bestSessionMs)}`;
      } else {
        personalBestDisplay.textContent = '';
      }
      
      const timeLeftMs = getTimeLeftTodayMs();
      if (todayMs >= TARGET_MS) {
        timeLeftDisplay.textContent = "target reached ✓";
        timeLeftDisplay.style.color = "rgba(120, 200, 120, 0.6)";
      } else {
        timeLeftDisplay.textContent = `${formatDuration(timeLeftMs)} left in the day`;
        timeLeftDisplay.style.color = "rgba(255, 255, 255, 0.25)";
      }
    }

    function updateAll() {
      checkDayTransition();
      updateClock();
      updateStudyTimer();
      updateCountdown();
      checkHourlyMilestone();
      updateIntensityGlow();
    }

    // ══════════════════════════════════════════════════
    // QUOTES
    // ══════════════════════════════════════════════════
    function updateQuote() {
      quoteEl.classList.add('fade-out');
      setTimeout(() => {
        currentQuoteIndex = (currentQuoteIndex + 1) % QUOTES.length;
        quoteEl.textContent = QUOTES[currentQuoteIndex];
        quoteEl.classList.remove('fade-out');
      }, 1000); 
    }
    
    function startQuoteRotation() {
      for (let i = QUOTES.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [QUOTES[i], QUOTES[j]] = [QUOTES[j], QUOTES[i]];
      }
      quoteEl.textContent = QUOTES[0];
      if (quoteInterval) clearInterval(quoteInterval);
      quoteInterval = setInterval(updateQuote, 15000);
    }

    // ══════════════════════════════════════════════════
    // CONFETTI 🎉
    // ══════════════════════════════════════════════════
    function checkAndFireConfetti() {
      const data = loadData();
      const today = getTodayKey();

      // Already shown today
      if (data.confettiShownDate === today) return;

      const todayMs = getTodayTotalMs() + getCurrentSessionMs();
      if (todayMs >= TARGET_MS) {
        data.confettiShownDate = today;
        saveData(data);
        fireConfetti();
      }
    }

    function fireConfetti() {
      const ctx = confettiCanvas.getContext('2d');
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      const particles = [];
      const colors = [
        'rgba(255,255,255,0.8)',
        'rgba(200,200,200,0.6)',
        'rgba(150,200,150,0.7)',
        'rgba(180,180,220,0.6)',
        'rgba(220,200,160,0.7)'
      ];

      // Create particles — subtle, library-safe amount
      for (let i = 0; i < 60; i++) {
        particles.push({
          x: Math.random() * confettiCanvas.width,
          y: -10 - Math.random() * confettiCanvas.height * 0.5,
          w: 3 + Math.random() * 4,
          h: 2 + Math.random() * 3,
          vx: (Math.random() - 0.5) * 2,
          vy: 1.5 + Math.random() * 2.5,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1
        });
      }

      let frame = 0;
      const maxFrames = 180; // ~3 seconds at 60fps

      function animate() {
        frame++;
        if (frame > maxFrames) {
          ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
          return;
        }

        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.04; // gravity
          p.rotation += p.rotSpeed;

          // Fade out in last 60 frames
          if (frame > maxFrames - 60) {
            p.life = Math.max(0, (maxFrames - frame) / 60);
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    }

    // ══════════════════════════════════════════════════
    // SLIDE UP GESTURE
    // ══════════════════════════════════════════════════
    let touchStartY = 0;
    let touchStartTime = 0;

    startScreen.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    startScreen.addEventListener('touchend', (e) => {
      const touchEndY = e.changedTouches[0].clientY;
      const deltaY = touchStartY - touchEndY;
      const deltaTime = Date.now() - touchStartTime;

      // Swipe up: at least 50px upward or fast flick (30px in <300ms)
      if (deltaY > 50 || (deltaY > 30 && deltaTime < 300)) {
        startStudySession();
      }
    }, { passive: true });

    // Also allow click/tap for non-touch devices
    startScreen.addEventListener('click', (e) => {
      // Only trigger on click if no touch event (desktop fallback)
      if (touchStartTime === 0 || Date.now() - touchStartTime > 1000) {
        startStudySession();
      }
    });

    function startStudySession() {
      if (sessionActive) return;
      sessionActive = true;

      // Hide start screen, show clock
      startScreen.classList.add('hidden');
      clockScreen.classList.add('visible');

      // Start timer
      startTimer();
      startQuoteRotation();

      // Start clock updates
      updateAll();
      const now = new Date();
      const msUntilNextSecond = 1000 - now.getMilliseconds();
      setTimeout(() => {
        updateAll();
        clockInterval = setInterval(updateAll, 1000);
      }, msUntilNextSecond);

      // Start autosave
      autosaveTimer = setInterval(() => {
        saveCurrentSession();
        updateStartScreen(); // Keep 10h bar updated
        checkAndFireConfetti();
      }, AUTOSAVE_INTERVAL);

      // Request wake lock
      requestWakeLock();
    }

    // ══════════════════════════════════════════════════
    // VISIBILITY — PAUSE/RESUME
    // ══════════════════════════════════════════════════
    document.addEventListener('visibilitychange', () => {
      checkDayTransition();

      if (!sessionActive) return;

      if (document.visibilityState === 'hidden') {
        // App going to background — pause & save
        pauseTimer();
      } else if (document.visibilityState === 'visible') {
        // App coming back — resume
        startTimer();
        requestWakeLock();
        updateAll();
      }
    });

    // Additional save hooks for when app is killed
    window.addEventListener('pagehide', () => {
      if (sessionActive) pauseTimer();
    });

    window.addEventListener('beforeunload', () => {
      if (sessionActive) pauseTimer();
    });

    // Freeze/resume for mobile browsers
    if ('onfreeze' in document) {
      document.addEventListener('freeze', () => {
        if (sessionActive) pauseTimer();
      });
      document.addEventListener('resume', () => {
        checkDayTransition();
        if (sessionActive) {
          startTimer();
          updateAll();
        }
      });
    }

    // ══════════════════════════════════════════════════
    // TAP TO DIM (only on clock screen)
    // ══════════════════════════════════════════════════
    clockScreen.addEventListener('click', () => {
      isDimmed = !isDimmed;
      document.body.classList.toggle('dimmed', isDimmed);
    });

    // ══════════════════════════════════════════════════
    // WAKE LOCK
    // ══════════════════════════════════════════════════
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeIndicator.classList.add('active');
          wakeLock.addEventListener('release', () => {
            wakeIndicator.classList.remove('active');
          });
        }
      } catch (err) {
        console.log('Wake Lock:', err.message);
      }
    }

    // ══════════════════════════════════════════════════
    // SERVICE WORKER
    // ══════════════════════════════════════════════════
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    // ══════════════════════════════════════════════════
    // INIT — SHOW START SCREEN WITH TODAY'S DATA
    // ══════════════════════════════════════════════════
    updateStartScreen();

    // Start periodic check for day transition (especially useful when on start screen)
    setInterval(checkDayTransition, 10000);
  </script>
</body>
